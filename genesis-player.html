<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genesis player</title><link rel="stylesheet" href="nes-player.css"><style>#genesis{position:absolute;inset:0}#cover button{background:#4e86d8;color:#fff;border:0;border-radius:8px;padding:14px 24px;font:700 16px 'Segoe UI',sans-serif;cursor:pointer}#stage{min-height:280px}</style></head><body><main class="nes-player"><div class="nes-layout"><section class="stage" id="stage" tabindex="0" aria-label="Genesis game screen"><div id="genesis"></div><div id="cover"><div><span class="system-label">SEGA GENESIS · 16-BIT</span><h1 id="opening">Genesis</h1><p id="opening-note">Start to load the game.</p><button id="start-game">Start game</button></div></div></section><aside class="player-sidebar"><img class="controller-diagram" src="assets/genesis-controls.png" alt="Genesis keyboard controls: WASD move, J A, K B, L C, H Start"><div class="controls"><h2 id="controls-title">CONTROLS</h2><div class="key-grid"><span id="move-label">Move</span><strong>W A S D</strong><span>Start</span><strong>H</strong><span>A</span><strong>J</strong><span>B</span><strong>K</strong><span>C</span><strong>L</strong></div><p id="focus-note">Click the game screen to use the keyboard.</p></div></aside></div><div class="status-row"><p id="status" role="status">Ready to load.</p><button id="retry" hidden>Try again</button><button id="return">Return to lesson</button></div><footer>EmulatorJS · Genesis Plus GX · <a href="https://github.com/EmulatorJS/EmulatorJS" target="_blank" rel="noopener">Source & licenses</a> · <span id="escape-note">Esc: return to lesson</span></footer></main><script src="genesis-player.js"></script></body></html>
