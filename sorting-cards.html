<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 2 · Sorting cards</title><style>
*{box-sizing:border-box}body{margin:25px;font:15px/1.5 'Segoe UI',sans-serif;color:#253a54;background:#eef2f7}.toolbar{display:flex;gap:15px;align-items:center;flex-wrap:wrap;max-width:1050px;margin:0 auto 20px}.toolbar h1{font-size:23px;margin:0}.toolbar button{background:#4e86d8;color:white;border:0;border-radius:8px;padding:12px 18px;font:700 14px 'Segoe UI';cursor:pointer}.toolbar p{width:100%;margin:0;font-size:13px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:1050px;margin:auto}.cards figure{margin:0;border:1px dashed #79889c;border-radius:7px;background:#fff;break-inside:avoid;padding:10px}.cards img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain}.cards figcaption{text-align:center;font-weight:700;font-size:14px;padding:7px}.cards figcaption span{margin-right:10px;color:#63748b}@media(max-width:600px){.cards{grid-template-columns:repeat(2,1fr)}body{margin:12px}}@media print{@page{size:letter;margin:.45in}body{margin:0;background:white}.toolbar{display:none}.cards{grid-template-columns:repeat(2,1fr);gap:.15in;max-width:none}.cards figure{height:3.18in;padding:.08in;break-inside:avoid}.cards img{height:2.65in;aspect-ratio:auto}.cards figcaption{font-size:11pt;padding:3px}.cards figure:nth-child(6n){break-after:page}}
</style></head><body><div class="toolbar"><h1 id="heading">Lesson 2 · Sorting cards</h1><button id="print">Print / save PDF</button><button id="language">Español</button><p id="note">Cut on the dotted lines. Give each group all 12 cards. Students choose their own categories. Draft illustrations can be replaced with photographs in Teacher setup.</p></div><main class="cards" id="cards"></main><script src="lesson-config.js"></script><script src="lesson-content.js"></script><script>
let es=false,settings={};try{settings=JSON.parse(localStorage.getItem('cheesestick-nintendo-lesson-2-v1-settings')||'{}')||{};}catch{}
const escapeHTML=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){document.documentElement.lang=es?'es':'en';document.getElementById('heading').textContent=es?'Lección 2 · Tarjetas para clasificar':'Lesson 2 · Sorting cards';document.getElementById('language').textContent=es?'English':'Español';document.getElementById('print').textContent=es?'Imprimir / guardar PDF':'Print / save PDF';document.getElementById('note').textContent=es?'Corta por las líneas punteadas. Da las 12 tarjetas a cada grupo. Los estudiantes eligen sus categorías. Puedes reemplazar las ilustraciones por fotos en la configuración docente.':'Cut on the dotted lines. Give each group all 12 cards. Students choose their own categories. Draft illustrations can be replaced with photographs in Teacher setup.';document.getElementById('cards').innerHTML=LAB_SORT.map((item,i)=>{let image=item.image;try{const candidate=settings.sortImages?.[item.id]||LAB_CONFIG.sortImages[item.id]||image,u=new URL(candidate,location.href);if(u.protocol==='https:'||u.origin===location.origin)image=u.href;}catch{}return '<figure><img src="'+escapeHTML(image)+'" alt="'+escapeHTML(item.label[es?1:0])+'"><figcaption><span>'+String(i+1).padStart(2,'0')+'</span>'+escapeHTML(item.label[es?1:0])+'</figcaption></figure>';}).join('');}
document.getElementById('print').onclick=()=>print();document.getElementById('language').onclick=()=>{es=!es;render();};render();
</script></body></html>
