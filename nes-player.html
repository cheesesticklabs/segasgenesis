<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NES player</title><link rel="stylesheet" href="nes-player.css"></head>
<body><main class="nes-player"><div class="nes-layout"><section class="stage" id="stage" aria-label="NES game screen" tabindex="0"><div id="nes"></div><div id="cover"><div><span class="system-label">NINTENDO ENTERTAINMENT SYSTEM</span><h1 id="opening">Loading game…</h1><p id="opening-note">Your game starts automatically.</p></div></div></section><aside class="player-sidebar"><img class="controller-diagram" id="controls-image" alt="NES keyboard controls" hidden><div class="controls"><h2 id="controls-title">CONTROLS</h2><div class="key-grid"><span id="move-label">Move</span><strong>W A S D</strong><span>Select</span><strong>F</strong><span>Start</span><strong>H</strong><span>B</span><strong>J</strong><span>A</span><strong>K</strong></div><p id="focus-note">Click the game screen to use the keyboard.</p></div></aside></div><div class="status-row"><p id="status" role="status" aria-live="polite">Loading game…</p><button id="retry" hidden>Try again</button><button id="return">Return to lesson</button></div><footer>JSNES 2.1.0 · <a href="https://github.com/bfirsh/jsnes" target="_blank" rel="noopener">Source</a> · <a href="LICENSE-jsnes.txt" target="_blank">Apache-2.0</a> · <span id="escape-note">Esc: return to lesson</span></footer></main><script src="jsnes.min.js"></script><script src="nes-zip.js"></script><script src="nes-player.js"></script></body></html>
